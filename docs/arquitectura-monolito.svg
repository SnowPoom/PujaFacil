<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1675" viewBox="0 0 1600 1675" role="img">
    <title>Arquitectura de PujaFácil y fronteras de confianza</title>
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/></marker></defs>
    <rect width="100%" height="100%" fill="#F7F5F1"/><text x="55" y="62" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#1F3A5F">PujaFácil / arquitectura del monolito</text><text x="55" y="104" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526575">Un proceso Node.js 24 · Next.js 16 App Router · Socket.IO 4 · PostgreSQL 16</text><rect x="45" y="145" width="1510" height="235" rx="16" fill="#EBF0F5" stroke="#1F3A5F" stroke-width="2" stroke-dasharray="10 7"/><text x="68" y="183" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1F3A5F">01  CLIENTE / NAVEGADOR — frontera de confianza</text><rect x="68" y="207" width="405" height="145" rx="16" fill="white" stroke="#CBD5DF" stroke-width="2" /><text x="90" y="243" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1F3A5F">UI pública</text><text x="90" y="280" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Catálogo / · /subastas</text><text x="90" y="311" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Acceso, registro y recuperación</text><rect x="495" y="207" width="620" height="145" rx="16" fill="white" stroke="#CBD5DF" stroke-width="2" /><text x="517" y="243" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1F3A5F">UI autenticada / Header compartido</text><text x="517" y="280" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Panel, artículos, verificación y perfil</text><text x="517" y="311" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Administración y auditoría</text><rect x="1137" y="207" width="395" height="145" rx="16" fill="white" stroke="#CBD5DF" stroke-width="2" /><text x="1159" y="243" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1F3A5F">Socket.IO Client</text><text x="1159" y="280" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Chat, presencia y pujas</text><text x="1159" y="311" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Cookie de sesión HttpOnly</text><polyline points="530,380 530,462" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="417" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">HTTP(S): HTML / RSC / JSON / archivos</text><polyline points="1325,380 1325,462" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrow)"/><text x="935" y="417" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Socket.IO: polling + WS / WSS</text><rect x="45" y="465" width="1510" height="770" rx="16" fill="#E8EDF3" stroke="#1F3A5F" stroke-width="2" stroke-dasharray="10 7"/><text x="68" y="505" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3A5F">02  APLICACIÓN — un único bloque desplegable Next.js / Node.js</text><text x="68" y="542" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#1F2933">server.ts · un servidor HTTP o HTTPS · puerto 3000 por defecto · Socket.IO /socket.io</text><rect x="68" y="568" width="710" height="140" rx="16" fill="white" stroke="#CBD5DF" stroke-width="2" /><text x="90" y="604" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1F3A5F">Presentación / App Router</text><text x="90" y="641" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Vistas SSR y Server Components</text><text x="90" y="672" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Client Components para formularios e interacción</text><rect x="800" y="568" width="732" height="140" rx="16" fill="white" stroke="#CBD5DF" stroke-width="2" /><text x="822" y="604" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1F3A5F">Tiempo real / mismo proceso Node</text><text x="822" y="641" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">registerSocketHandlers(io) → src/server/socket/index.ts</text><text x="822" y="672" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Handshake de sesión, permisos y salas por subasta</text><rect x="68" y="730" width="1464" height="166" rx="16" fill="white" stroke="#CBD5DF" stroke-width="2" /><text x="90" y="766" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1F3A5F">Route Handlers / API y controles de acceso</text><text x="90" y="803" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">/api/auth/* · /api/articles/* · /api/verification/* · /api/auctions/*</text><text x="90" y="834" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">/api/files/* · /api/audit · /api/chat/* · /api/me/bids · /api/admin/*</text><text x="90" y="865" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">assertTrustedOrigin · requireSession · requireRole · requireActive</text><polyline points="420,708 420,729" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1150,708 1150,729" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrow)"/><rect x="68" y="919" width="460" height="140" rx="16" fill="white" stroke="#CBD5DF" stroke-width="2" /><text x="90" y="955" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1F3A5F">Autenticación y artículos</text><text x="90" y="992" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Cuentas, sesiones, roles y cifrado</text><text x="90" y="1023" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Catálogo y expediente del artículo</text><rect x="550" y="919" width="460" height="140" rx="16" fill="white" stroke="#CBD5DF" stroke-width="2" /><text x="572" y="955" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1F3A5F">Verificación / subastas</text><text x="572" y="992" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Revisión y ciclo de subastas</text><text x="572" y="1023" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Pujas transaccionales FOR UPDATE</text><rect x="1032" y="919" width="500" height="140" rx="16" fill="white" stroke="#CBD5DF" stroke-width="2" /><text x="1054" y="955" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1F3A5F">Chat / servicios compartidos</text><text x="1054" y="992" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Seudónimos, presencia y notificaciones</text><text x="1054" y="1023" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Archivos privados y auditoría sin PII</text><polyline points="420,896 420,918" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1160,896 1160,918" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrow)"/><rect x="68" y="1105" width="942" height="105" rx="16" fill="white" stroke="#CBD5DF" stroke-width="2" /><text x="90" y="1141" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1F3A5F">Acceso a datos / Prisma Client singleton</text><text x="90" y="1178" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">src/lib/prisma.ts · transacciones y relaciones</text><rect x="1032" y="1105" width="500" height="105" rx="16" fill="white" stroke="#CBD5DF" stroke-width="2" /><text x="1054" y="1141" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1F3A5F">Acceso a archivos / Node fs</text><text x="1054" y="1178" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Validación y autorización en servidor</text><polyline points="780,1059 780,1104" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1280,1059 1280,1104" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrow)"/><polyline points="530,1210 530,1330" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="1281" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Prisma → conexión PostgreSQL (TCP 5432)</text><polyline points="1280,1210 1280,1330" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrow)"/><text x="1010" y="1281" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Lectura / escritura privada</text><rect x="45" y="1332" width="1510" height="216" rx="16" fill="#EFE8D9" stroke="#C6A15B" stroke-width="2" stroke-dasharray="10 7"/><text x="68" y="1370" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1F3A5F">03  PERSISTENCIA — frontera de confianza</text><rect x="68" y="1393" width="942" height="128" rx="16" fill="white" stroke="#CBD5DF" stroke-width="2" /><text x="90" y="1429" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1F3A5F">PostgreSQL 16 / servicio db</text><text x="90" y="1466" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">13 entidades · claves foráneas · importes Decimal(12,2)</text><text x="90" y="1497" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Volumen persistente pujafacil_pgdata</text><rect x="1032" y="1393" width="500" height="128" rx="16" fill="white" stroke="#CBD5DF" stroke-width="2" /><text x="1054" y="1429" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1F3A5F">storage/private/</text><text x="1054" y="1466" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Fotos, certificados e identidad ficticia</text><text x="1054" y="1497" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2933">Fuera de public/ · volumen persistente</text><text x="55" y="1600" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526575">TLS opcional local: HTTPS_KEY_PATH + HTTPS_CERT_PATH. En producción: HTTPS / WSS y cookies Secure.</text><text x="55" y="1635" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526575">Los permisos se verifican en servidor; la navegación condicional no reemplaza los guards.</text></svg>
